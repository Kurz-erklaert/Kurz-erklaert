name: Reel veröffentlichen
on:
  schedule:
    # Alle 10 Minuten rund um die Slots (UTC 6-9 und 16-19, deckt Winter- und Sommerzeit ab).
    # publish.py prüft selbst, ob ein Slot (8:00 / 18:30 deutsche Zeit) fällig ist; Verspätungen von GitHub werden so aufgeholt.
    - cron: "*/10 6-9,16-19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen, nichts veröffentlichen (1 = ja)"
        default: "1"
permissions:
  contents: write
  actions: write
concurrency:
  group: reel-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Veröffentlichen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python3 publish.py
      - name: Stand speichern
        id: speichern
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json posted_at.json
          if ! git diff --cached --quiet; then
            git commit -m "gepostet"
            git pull --rebase -q && git push || (sleep 5; git pull --rebase -q && git push)
            echo "neu=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Kennzahlen und Excel neu bauen
        if: steps.speichern.outputs.neu == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/workflows/insights.yml/dispatches -f ref=main
