name: Reel veröffentlichen
on:
  schedule:
    # Alle 10 Minuten rund um die Slots (UTC 6-9 und 16-19, deckt Winter- und Sommerzeit ab).
    # publish.py prüft selbst, ob ein Slot (8:00 / 18:30 deutsche Zeit) fällig ist; Verspätungen von GitHub werden so aufgeholt.
    - cron: "*/10 6-9,16-19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen, nichts veröffentlichen (1 = ja)"
        default: "1"
permissions:
  contents: write
concurrency:
  group: reel-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Veröffentlichen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python3 publish.py
      - name: Stand speichern
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json posted_at.json
          git diff --cached --quiet || (git commit -m "gepostet" && git push)
