name: Kennzahlen abrufen
on:
  schedule:
    - cron: "0 4,12,20 * * *"   # dreimal täglich (Ausfälle einzelner Läufe fallen nicht ins Gewicht)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kennzahlen holen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 insights.py
      - name: Excel-Auswertung bauen
        continue-on-error: true
        run: |
          pip install -q openpyxl
          python3 agenten/baue_excel.py auswertung.xlsx
      - name: Speichern
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add insights.json auswertung.xlsx
          git diff --cached --quiet || (git commit -m "Kennzahlen" && (git pull --rebase -q && git push) || (sleep 5; git pull --rebase -q && git push))
