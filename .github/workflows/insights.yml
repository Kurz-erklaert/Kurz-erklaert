name: Kennzahlen abrufen
on:
  schedule:
    - cron: "0 20 * * *"   # täglich ca. 21:00 deutscher Winterzeit
  workflow_dispatch:
permissions:
  contents: write
jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kennzahlen holen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 insights.py
      - name: Speichern
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add insights.json
          git diff --cached --quiet || (git commit -m "Kennzahlen" && git push)
